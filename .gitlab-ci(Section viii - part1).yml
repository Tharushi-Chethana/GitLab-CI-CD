build_job:
  image: alpine
  stage: build
  script: 
    - echo "Building ..."

test_job:
  image: ubuntu
  stage: test
  script: 
    - echo "Testing ..."
    - if (( RANDOM % 2 == 0 )); then exit 1; else exit 0; fi
  retry: 2

some_job:
  image: ubuntu
  stage: test
  script: 
    - if (( RANDOM % 2 == 0 )); then exit 123; else exit 1; fi
  allow_failure:
    exit_codes:
      - 123 # acceptable
