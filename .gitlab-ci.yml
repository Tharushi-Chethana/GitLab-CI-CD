build_website:
  stage: build
  image: alpine
  script:
    - mkdir build
    - echo "<h1>My website</h1>" > build/index.html
  artifacts:
    paths:
      - build/


test_website:
  stage: test
  image: node:22-alpine
  before_script:
    - apk add curl
    - npm install -g serve
  script:
    - test -f build/index.html
    - serve build/ &
    - sleep 3
    - curl http://localhost:3000 | grep "My website"
