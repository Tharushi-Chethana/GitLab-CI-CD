workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Control when merge request pipelines run.
    - if : $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

variables:
  NETLIFY_SITE_ID: 'd31b585b-8d1d-4897-bf12-d1d9eeaa421f'

stages:
  - build
  - test
  - deploy_review
  - post_deploy_review
  - deploy_staging
  - deploy_prod

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths:
    - build/

test_artifact:
  image: alpine
  stage: test
  script:
    - test -f build/index.html

unit_tests:
  image: node:22-alpine
  stage: test
  script:
    - npm ci
    - npm test
  artifacts:  #publish the junit report
    when: always #always publish the report (when it fail or when it pass)
    reports:
      junit: ./reports/junit.xml

netlify_review:
  image: node:22-alpine
  stage: deploy_review
  rules:
    - if : $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH
    #CI_COMMIT_REF_NAME: The branch or tag name for which project is built.
    #CI_DEFAULT_BRANCH: The name of the project’s default branch.
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    # CI_COMMIT_REF_NAME in lowercase, shortened to 63 bytes, and with everything except 0-9 and a-z replaced with -. No leading / trailing -. Use in URLs, host names and domain names.
    url: $PREVIEW_URL
  before_script:
    - npm install -g netlify-cli
    - apk add curl jq # apk which stands for alpine package manager and install curl and jq
  script:
    - netlify --version
    - netlify status
    - echo "Depolying to project id $NETLIFY_SITE_ID"
    - netlify deploy --dir=build --no-build --json | tee deploy-result.json
    #- cat deploy-result.json
    #- jq -r '.deploy_url' deploy-result.json # get the url value using jq
    - REVIEW_URL=$(jq -r '.deploy_url' deploy-result.json) #Get the url value and store this into the REVIEW_URL variable
    - echo $REVIEW_URL
    - curl $REVIEW_URL | grep 'GitLab'
    - echo "REVIEW_URL=$REVIEW_URL" > deploy.env
    - cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

e2e:
  stage: post_deploy_review
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  variables: 
    APP_BASE_URL: $REVIEW_URL
  script:
    - echo $REVIEW_URL
    - echo $APP_BASE_URL
    - npm ci #install all dependencies
    - npm run e2e
netlify_staging:
  image: node:22-alpine
  stage: deploy_staging
  rules:
    - if : $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    #CI_COMMIT_REF_NAME: The branch or tag name for which project is built.
    #CI_DEFAULT_BRANCH: The name of the project’s default branch.
  environment:
    name: staging
    url: 'https://staging--tharushi-learn-gitlab.netlify.app'
  before_script:
    - npm install -g netlify-cli
    - apk add curl # apk which stands for alpine package manager 
  script:
    - netlify --version
    - netlify status
    - echo "Depolying to project id $NETLIFY_SITE_ID"
    - netlify deploy --alias staging --dir=build --no-build
    # we use apk of the alpine linux distribution to install curl
    - echo $CI_ENVIRONMENT_URL
    - curl $CI_ENVIRONMENT_URL | grep 'GitLab'
    # curl use to check the website.
    # | (pipe chatacter) use to send the result of actually getting the contents of 
    # this website to the grep command, which has the ability of the searching the text

netlify_prod:
  image: node:22-alpine
  stage: deploy_prod
  rules:
    - if : $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    #CI_COMMIT_REF_NAME: The branch or tag name for which project is built.
    #CI_DEFAULT_BRANCH: The name of the project’s default branch.
  environment: production
  before_script:
    - npm install -g netlify-cli
    - apk add curl # apk which stands for alpine package manager 
  script:
    - netlify --version
    - netlify status
    - echo "Depolying to project id $NETLIFY_SITE_ID"
    - netlify deploy --prod --dir=build --no-build
    # we use apk of the alpine linux distribution to install curl
    - curl $CI_ENVIRONMENT_URL | grep 'GitLab'
    # curl use to check the website.
    # | (pipe chatacter) use to send the result of actually getting the contents of 
    # this website to the grep command, which has the ability of the searching the text