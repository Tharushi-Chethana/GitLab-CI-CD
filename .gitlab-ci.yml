variables:
  NETLIFY_SITE_ID: 'd31b585b-8d1d-4897-bf12-d1d9eeaa421f'
  VITE_APP_VERSION: $CI_COMMIT_SHORT_SHA

stages:
  - build
  - deploy

build_docker_netlify:
  stage: .pre
  image: docker:27
  services:
    - docker:27-dind
  script:
   - docker version
   - docker build -t netlify -f ci/Dockerfile .
   #  dot(.) itself in a command refres to current directory
   # -t netlify = give name and tag
   - docker image ls

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths: 
      - build/

netlify_prod:
  image: node:22-alpine
  stage: deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  environment: production
  before_script: 
    - npm install -g netlify-cli
    - apk add curl
  script:
    - netlify --version
    - netlify status
    - echo "Deploying to site id $NETLIFY_SITE_ID"
    - netlify deploy --prod --dir=build --no-build
    - curl $CI_ENVIRONMENT_URL | grep 'GitLab'