variables:
  VITE_APP_VERSION: $CI_COMMIT_SHORT_SHA

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths: 
      - build/

aws-s3:
 stage: deploy
 image:
  name: amazon/aws-cli:2.23.0
  entrypoint: [""]
 script:
   - aws --version
  #  - aws s3 cp index.html s3://$AWS_S3_BUCKET/index.html
   - aws s3 sync ./build/ s3://$AWS_S3_BUCKET