api-tests:
  image: node:22-alpine
  stage: test
  before_script:
    - npm install -g newman newman-reporter-htmlextra
    # install newman and html report
  script:
    - newman run collection.json -r htmlextra --reporter-htmlextra-export ./public/index.html
    # run this collection.json file and then storing the results of the test in this html report
  pages: true