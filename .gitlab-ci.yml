variables:
  VITE_APP_VERSION: $CI_COMMIT_SHORT_SHA

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths: 
      - build/

build_docker_image:
  image: 
    name: amazon/aws-cli:2.23.0
    entrypoint: [""]
  stage: .pre
  services:
    - docker:27-dind
  variables: 
    DOCKER_HOST: tcp://docker:2375/
  before_script:
  # design specifically for Amazon Linux to manage packages and software from a curated repository which includes the newest versions of standard software that wann install
    - amazon-linux-extras install docker
  script:
    - aws --version
    - docker version

ecs_deploy:
  stage: .pre
  image: 
    name: amazon/aws-cli:2.23.0
    entrypoint: [""]
  script:
    - aws --version
    # update the task definition
    - aws ecs register-task-definition --cli-input-json file://aws/td-prod.json
    # update the service
    - aws ecs update-service --cluster LearnGitLabApp-Cluster-Tharushi --service LearnGitLabApp-TD-Prod --task-definition LearnGitLabApp-TD-Prod
    - aws ecs wait services-stable --cluster LearnGitLabApp-Cluster-Tharushi --services LearnGitLabApp-TD-Prod