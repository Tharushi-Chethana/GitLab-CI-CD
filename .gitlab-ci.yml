stages:
  - build
  - package
  - deploy

variables:
  VITE_APP_VERSION: $CI_COMMIT_SHORT_SHA

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths: 
      - build/

build_docker_image:
  image: 
    name: amazon/aws-cli:2.23.0
    entrypoint: [""]
  stage: package
  services:
    - docker:27-dind
  variables: 
    DOCKER_HOST: tcp://docker:2375/
  before_script:
  # design specifically for Amazon Linux to manage packages and software from a curated repository which includes the newest versions of standard software that wann install
    - amazon-linux-extras install docker
  script:
    - aws --version
    - docker version
    # build docker image
    - docker build -t $DOCKER_REGISTRY/learngitlabapp:$VITE_APP_VERSION .
    # use aws ecr to get the login password and passing this to docker login
    - aws ecr get-login-password | docker login --username AWS --password-stdin $DOCKER_REGISTRY
    # push docker image 
    - docker push $DOCKER_REGISTRY/learngitlabapp:$VITE_APP_VERSION

ecs_deploy:
  stage: deploy
  image: 
    name: amazon/aws-cli:2.23.0
    entrypoint: [""]
  script:
    - aws --version
    # update the task definition
    - aws ecs register-task-definition --cli-input-json file://aws/td-prod.json
    # update the service
    - aws ecs update-service --cluster LearnGitLabApp-Cluster-Tharushi --service LearnGitLabApp-TD-Prod --task-definition LearnGitLabApp-TD-Prod
    - aws ecs wait services-stable --cluster LearnGitLabApp-Cluster-Tharushi --services LearnGitLabApp-TD-Prod