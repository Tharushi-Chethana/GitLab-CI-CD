stages:
  - build
  - test

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - ls -la
    - npm ci
    - npm run build
    - cd build
    - ls -la
  artifacts:
    paths:
    - build/

test_artifact:
  image: alpine
  stage: test
  script:
    - test -f build/index.html

unit_tests:
  image: node:22-alpine
  stage: test
  script:
    - npm ci
    - npm test
  artifacts:  #publish the junit report
    when: always #always publish the report (when it fail or when it pass)
    reports:
      junit: ./reports/junit.xml,