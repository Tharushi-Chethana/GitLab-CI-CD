variables:
  VITE_APP_VERSION: $CI_COMMIT_SHORT_SHA

build_website:
  image: node:22-alpine
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths: 
      - build/

ssh_deploy:
  stage: .pre
  image: alpine
  script:
    #check if port 22 is open on the server
    #- nc -zv 54.235.10.186 22
    - nc -zv $REMOTE_DEPLOY_HOST 22
    - echo $SSH_PRIVATE_KEY
    - cat $SSH_PRIVATE_KEY