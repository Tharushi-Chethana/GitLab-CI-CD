api_call_job:
  image: alpine
  variables:
    OPENAI_API_KEY: ""
  before_script:
    - apk add curl
  script:
    - echo "Calling the OpenAI API ..."
    - chmod +x script.sh
    - ./script.sh
    - |
      curl "https://api.openai.com/v1/chat/completions" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $OPENAI_API_KEY" \
      -d '{
          "model": "gpt-4.1",
          "messages": [
              {
                  "role": "user",
                  "content": "Write a one-sentence bedtime story about a unicorn."
              }
          ]
      }'